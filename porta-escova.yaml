  # --- SCRIPT: MOSTRAR ALARME RÁPIDO (NOVO) ---
  - id: visualizar_alarme_temp
    mode: restart
    then:
      - lambda: 'id(mostrar_horario_alarme) = true;'
# 2. Verifica se o alarme está ATIVO ou INATIVO
      - if:
          condition:
            lambda: 'return id(alarme_ativo_bool);'
          then:
            # === SE ESTIVER ATIVO (VERDE + BIP NORMAL) ===
            - light.turn_on:
                id: led_rgb
                brightness: 50%
                red: 0%
                green: 100%
                blue: 0%
                transition_length: 0s
            - rtttl.play: "bip:d=16,o=6,b=100:c"
          
          else:
            # === SE ESTIVER DESATIVADO (VERMELHO + SOM CANCELA) ===
            - light.turn_on:
                id: led_rgb
                brightness: 50%
                red: 100%
                green: 0%
                blue: 0%
                transition_length: 0s
            # Som de cancelamento (o mesmo do botão sair)
            - rtttl.play: "cancel:d=16,o=5,b=140:c,g4"

      - delay: 2s
      
      - lambda: 'id(mostrar_horario_alarme) = false;'
      - light.turn_off: led_rgb

# ==================================================
# INTERVALO DE TEMPO
# ==================================================
interval:
  - interval: 1s
    then:
      # Lógica do Cronômetro
      - if:
          condition: { lambda: 'return id(cronometro_ativo) && id(segundos_restantes) > 0;' }
          then:
            - lambda: 'id(segundos_restantes)--;'
            
            # --- APITO DINÂMICO (CORREÇÃO DO BUG) ---
            - if:
                condition: 
                  lambda: |-
                    return (id(segundos_restantes) > 0 && id(segundos_restantes) % 30 == 0);
                then:
                  - rtttl.play: "bip:d=16,o=6,b=100:c"

      - if: # FIM DO CRONOMETRO
          condition: { lambda: 'return id(cronometro_ativo) && id(segundos_restantes) == 0;' }
          then:
             - lambda: 'id(cronometro_ativo) = false; id(fim_cronometro) = true;'
             - light.turn_on: 
                 id: led_rgb
                 effect: !lambda |-
                   if(id(timer_efeito_idx)==0) return "Arco Íris";
                   if(id(timer_efeito_idx)==1) return "Fogos";
                   if(id(timer_efeito_idx)==2) return "Sinaleiro";
                   if(id(timer_efeito_idx)==3) return "Cintilar";
                   return "Strobe Verde Amarelo Vermelho";
             
             # SELEÇÃO DE MÚSICA DO TIMER
             - if:
                 condition: { lambda: 'return id(timer_som_idx) == 0;' }
                 then:
                   - rtttl.play: "smb:d=4,o=5,b=100:16e6,16e6,32p,8e6,16c6,8e6,8g6"
             - if:
                 condition: { lambda: 'return id(timer_som_idx) == 1;' }
                 then:
                   - rtttl.play: "star:d=4,o=6,b=160:8c6,8e6,8g6,8c7,4g6"
             - if:
                 condition: { lambda: 'return id(timer_som_idx) == 2;' }
                 then:
                   - rtttl.play: "coin:d=16,o=6,b=180:e,g"
             - if:
                 condition: { lambda: 'return id(timer_som_idx) == 3;' }
                 then:
                   - rtttl.play: "smbdeath:d=4,o=5,b=90:32c6,32c6,32c6,8p,16b,16f6,16p,16f6,16f.6,16e.6,16d6,16c6,16p,16e,16p,16c"
             - if:
                 condition: { lambda: 'return id(timer_som_idx) == 4;' }
                 then:
                   - rtttl.play: "1up:d=4,o=6,b=160:e,g,e7,c7,d7,g7"

             - delay: 4s
             - lambda: 'id(fim_cronometro) = false;'
             - light.turn_off: led_rgb

      # Lógica do Alarme (CORRETA)
      - if:
          condition:
            lambda: |-
              auto now = id(hora_atual).now();
              return id(alarme_ativo_bool) && now.is_valid() && 
                     now.hour == id(alarme_hh) && now.minute == id(alarme_mm) && 
                     now.second == 0;
          then:
             # CHAMA O SCRIPT DE LOOP QUE ESTAVA FALTANDO
             - script.execute: executar_alarme_loop


  - interval: 1s
    then:
      - if:
          condition: 
            lambda: 'return id(ha_mode_ativo);'
          then:
            - lambda: |-
                static int contador = 0;
                contador++;
                
                // Passo 0: Mostra "-HA-" (Dura 2 segundos)
                if (id(ha_loop_step) == 0) {
                   if (contador >= 2) { 
                      id(ha_loop_step) = 1; 
                      contador = 0; 
                   }
                }
                // Passo 1: Temperatura (Dura 3 segundos)
                else if (id(ha_loop_step) == 1) {
                   if (contador >= 7) { 
                      id(ha_loop_step) = 2; 
                      contador = 0; 
                   }
                }
                // Passo 2: Umidade (Dura 3 segundos)
                else if (id(ha_loop_step) == 2) {
                   if (contador >= 7) { 
                      id(ha_loop_step) = 0; // Volta pro começo
                      contador = 0; 
                   }
                }
            
            # --- ATUALIZA A LUZ CONFORME O PASSO ---
            - if:
                condition: { lambda: 'return id(ha_loop_step) == 0;' } # -HA-
                then:
                  - light.turn_on: { id: led_rgb, brightness: 50%, red: 0%, green: 100%, blue: 100% } # Ciano
            - if:
                condition: { lambda: 'return id(ha_loop_step) == 1;' } # Temperatura
                then:
                  - light.turn_on: { id: led_rgb, brightness: 50%, red: 100%, green: 0%, blue: 0% } # Vermelho
            - if:
                condition: { lambda: 'return id(ha_loop_step) == 2;' } # Umidade
                then:
                  - light.turn_on: { id: led_rgb, brightness: 50%, red: 0%, green: 0%, blue: 100% } # Azul

# ==================================================
# BOTÕES PARA HOME ASSISTANT
# ==================================================
button:
  - platform: template
    name: "Iniciar Timer"
    icon: "mdi:timer-play"
    on_press:
      - script.execute: toggle_cronometro

# ==================================================
# SENSOR DE TEXTO (SIM / NÃO)
# ==================================================

text_sensor:
  - platform: template
    name: "Presença da Escova"
    icon: "mdi:toothbrush"
    lambda: |-
      if (id(status_escova).state) {
        return {"Sim"};
      } else {
        return {"Não"};
      }
    update_interval: 200ms

  - platform: wifi_info
    ssid:
      name: "WiFi Conectado"
    bssid:
      name: "MAC do Roteador"
    ip_address:
      name: "IP do ESP"
